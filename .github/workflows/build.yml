name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:

    # ruby/setup-ruby has no Ruby < 3.2 for ubuntu-26.04, which ubuntu-latest now points to
    runs-on: ${{ contains(fromJSON('["2.5", "2.6", "2.7", "3.0", "3.1"]'), matrix.ruby-version) && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        ruby-version: ['2.5', '2.6', '2.7', '3.0', '3.1', '3.2', '3.3', '3.4', '4.0']

    name: Ruby (${{ matrix.ruby-version }})
    steps:
    - uses: actions/checkout@v2
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}
    - name: Run tests
      run: bundle install && bundle exec rake test
